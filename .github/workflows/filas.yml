# .github/workflows/filas.yml — Filas na Saúde: coleta diária do painel público da Prefeitura
# Roda às 20h, 21h e 22h (Brasília); só grava quando a Prefeitura publica uma carga nova.
name: Filas na Saúde
on:
  workflow_dispatch:
  push:
    branches: [saude-filas]
    paths: [".github/workflows/filas.yml"]
  schedule:
    - cron: "7 23 * * *"
    - cron: "7 0 * * *"
    - cron: "7 1 * * *"
permissions:
  contents: write
concurrency: { group: filas, cancel-in-progress: false }
jobs:
  filas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Coletar a carga do dia
        run: python programas/filas.py coletar
      - name: Gerar filas.json para o site
        run: python programas/filas.py json
      - name: Salvar
        run: |
          git config user.name "OSB Foz (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add programas/fontes_osb/filas/historico.csv filas.json
          git diff --cached --quiet || git commit -m "Filas na Saúde: carga $(tail -1 programas/fontes_osb/filas/historico.csv | cut -d, -f1)"
          git push
