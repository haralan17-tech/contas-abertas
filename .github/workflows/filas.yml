# .github/workflows/filas.yml — Filas na Saúde no site
# A coleta diária do OSB (20h–23h) grava o histórico na pasta do Dropbox
# "/Observatório Social/GT Saúde/Filas na Saúde/historico". Este fluxo baixa esse
# histórico pelo link público da pasta (abaixo; ou variável FILAS_DROPBOX_URL em
# Settings → Secrets and variables → Actions → Variables), gera filas.json e publica.
# Obs.: o painel da Prefeitura não aceita conexões dos servidores do GitHub,
# por isso a coleta em si continua sendo feita pela tarefa do OSB.
name: Filas na Saúde
on:
  workflow_dispatch:
  push:
    branches: [saude-filas]
    paths: [".github/workflows/filas.yml"]
  schedule:
    - cron: "40 2 * * *"   # 23h40 em Brasília
    - cron: "40 9 * * *"   # 6h40 em Brasília (reforço)
permissions:
  contents: write
concurrency: { group: filas, cancel-in-progress: false }
jobs:
  filas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Baixar o histórico do Dropbox
        env:
          # link público (somente leitura) da pasta "historico"; pode ser trocado pela variável FILAS_DROPBOX_URL
          FILAS_DROPBOX_URL: "${{ vars.FILAS_DROPBOX_URL || 'https://www.dropbox.com/scl/fo/mkivvz4lkxoemwf3l6suh/AHR-5qL_Y_HsGq_A6Oh_NLY?rlkey=o9f08i8401pq6edpsql6d5kj9&dl=1' }}"
        run: |
          if [ -z "$FILAS_DROPBOX_URL" ]; then echo "::error::Configure a variável FILAS_DROPBOX_URL"; exit 1; fi
          python programas/filas.py dropbox "$FILAS_DROPBOX_URL"
      - name: Gerar filas.json para o site
        run: python programas/filas.py json
      - name: Salvar
        run: |
          git config user.name "OSB Foz (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add programas/fontes_osb/filas/historico.csv filas.json
          git diff --cached --quiet || git commit -m "Filas na Saúde: carga $(tail -1 programas/fontes_osb/filas/historico.csv | cut -d, -f1)"
          git push
